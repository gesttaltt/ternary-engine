# Ternary Semantic Falsification - Configuration Schema
# Version: 1.0
# Philosophy: Listen to errors, discover by negative space

# =============================================================================
# COMPONENT WIRING
# =============================================================================
# All tests MUST wire these components - no isolated/abstract testing

components:
  simd_engine:
    module: "ternary_simd_engine"
    location: "ternary_simd_engine.cp312-win_amd64.pyd"
    operations: [tadd, tmul, tmin, tmax, tnot]
    description: "Native SIMD ternary arithmetic"
    required: true

  hyperbolic_vae:
    module: "models.3-vae-gemm-v1.hyperbolic_ops"
    location: "models/3-vae-gemm-v1/hyperbolic_ops.py"
    classes:
      - PoincareOperations
      - HyperbolicEncoder
      - HyperbolicOperationFlow
      - UltrametricAttractorField
    description: "Poincaré ball embeddings and geodesic operations"
    required: true

  ultrametric_energy:
    module: "models.gemm_discovery.ebm.ultrametric_energy"
    location: "models/gemm_discovery/ebm/ultrametric_energy.py"
    functions:
      - compute_3adic_valuation
      - compute_ultrametric_distance
      - compute_factor_valuation_profile
    classes:
      - UltrametricEnergyFunction
    description: "3-adic valuation and ultrametric distance"
    required: true

  codon_encoder:
    module: "codon_encoder"
    location: "models/company-flagships/hierarchy-encoder-codon-inference/codon-predictor/"
    files:
      - codon_encoder_3adic.pt
      - codon_mapping_3adic.json
    description: "Biological ultrametric hierarchy from codon structure"
    required: false  # Optional for non-biological tests

  operation_luts:
    module: "models.3-vae-gemm-v1.data"
    location: "models/3-vae-gemm-v1/data.py"
    description: "Complete 19,683 operation corpus"
    total_operations: 19683
    required: true

# =============================================================================
# HYPOTHESIS REGISTRY
# =============================================================================

hypotheses:
  H1:
    name: "p-adic / 3-adic Semantics"
    category: "algebraic"
    difficulty: "medium"
    components_required: [simd_engine, ultrametric_energy]
    predictions:
      - "Ultrametric triangle inequality holds"
      - "Operations cluster by valuation level"
      - "High-valuation results exponentially rare"

  H2:
