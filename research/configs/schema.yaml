# =============================================================================
# SCORING CONFIGURATION
# =============================================================================

scoring:
  grades:
    A: { min: 0.95, label: "Strong support" }
    B: { min: 0.80, label: "Moderate support" }
    C: { min: 0.50, label: "Weak support" }
    D: { min: 0.20, label: "Minimal support" }
    F: { min: 0.00, label: "FALSIFIED" }

  thresholds:
    falsification: 0.20  # Below this = falsified
    strong_support: 0.95  # Above this = strongly supported
    anomaly_alert: 0.10   # Alert if >10% anomalies

# =============================================================================
# EXECUTION CONFIGURATION
# =============================================================================

execution:
  corpus_size: 19683  # Total ternary operations
  batch_size: 1024
  timeout_per_hypothesis: 300  # seconds
  parallel_hypotheses: 4  # Run up to 4 in parallel
  save_anomalies: true
  verbose: true

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================

output:
  results_dir: "research/results"
  format: ["json", "markdown"]
  include_anomalies: true
  include_timing: true
  generate_visualization: true

# =============================================================================
# PRIORITY QUEUE (Easiest to Falsify First)
# =============================================================================

priority_queue:
  tier1_easy:
    - H11  # Lattice
    - H10  # Group
    - H6   # Three-valued logic
    - H23  # Modular

  tier2_medium:
    - H1   # p-adic
    - H2   # Ultrametric
    - H4   # Tropical
    - H9   # Information

  tier3_hard:
    - H3   # Hyperbolic
    - H12  # Dynamical
    - H7   # Quantum
    - H14  # Neural

  tier4_ultimate:
    - H24  # Sui Generis (test after all others)
