name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

env:
  # Build configuration
  PYTHON_VERSION_DEFAULT: '3.11'
  MSVC_ARCH: 'x64'
  COMPILER_FLAGS_WINDOWS: '/O2 /GL /arch:AVX2 /openmp /std:c++17'
  COMPILER_FLAGS_LINUX: '-O3 -march=haswell -mavx2 -fopenmp -std=c++17'

  # Dependency versions (can be overridden via repository secrets)
  PYBIND11_VERSION: 'latest'
  NUMPY_VERSION: 'latest'

  # Test configuration
  TEST_TIMEOUT_MINUTES: '10'
  ARTIFACT_RETENTION_DAYS: '7'

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(vars.TEST_TIMEOUT_MINUTES || '10') }}
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools pybind11${{ env.PYBIND11_VERSION != 'latest' && format('=={0}', env.PYBIND11_VERSION) || '' }} numpy${{ env.NUMPY_VERSION != 'latest' && format('=={0}', env.NUMPY_VERSION) || '' }}
      env:
        PYBIND11_VERSION: ${{ secrets.PYBIND11_VERSION || env.PYBIND11_VERSION }}
        NUMPY_VERSION: ${{ secrets.NUMPY_VERSION || env.NUMPY_VERSION }}

    - name: Build module
      run: python scripts/build/build.py
      env:
        BUILD_VERBOSE: ${{ secrets.BUILD_VERBOSE || '0' }}

    - name: Verify module was built
      run: |
        if (Test-Path "ternary_simd_engine*.pyd") {
          Write-Host "[OK] Module built successfully"
          Get-ChildItem ternary_simd_engine*.pyd | ForEach-Object {
            Write-Host "  Found: $($_.Name) ($([math]::Round($_.Length/1KB, 2)) KB)"
          }
          # Test import
          python -c "import ternary_simd_engine as tc; print('Module import: OK')"
        } else {
          Write-Host "[ERROR] No .pyd file found in project root!"
          Write-Host "Listing project root:"
          Get-ChildItem | Select-Object Name
          Write-Host "`nSearching build directory:"
          if (Test-Path "build") {
            Get-ChildItem -Path build -Recurse -Filter "*.pyd" -ErrorAction SilentlyContinue
          }
          exit 1
        }
      shell: pwsh

    - name: Report System Capabilities
      run: python tests/test_capabilities.py
      continue-on-error: true

    - name: Run tests
      run: python tests/run_tests.py --no-color
      env:
        TEST_VERBOSE: ${{ secrets.TEST_VERBOSE || '0' }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows-py${{ matrix.python-version }}
        path: |
          *.pyd
          build/artifacts/
        retention-days: ${{ fromJSON(vars.ARTIFACT_RETENTION_DAYS || env.ARTIFACT_RETENTION_DAYS) }}

