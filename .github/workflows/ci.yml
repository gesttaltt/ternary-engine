name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools pybind11 numpy

    - name: Build module
      run: python build.py

    - name: Report System Capabilities
      run: python tests/test_capabilities.py
      continue-on-error: true

    - name: Run tests
      run: python run_tests.py --no-color

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows-py${{ matrix.python-version }}
        path: |
          *.pyd
          build/artifacts/

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools pybind11 numpy

    - name: Check AVX2 support
      run: |
        echo "CPU Info:"
        grep -o 'avx2' /proc/cpuinfo | head -1 || echo "AVX2 not detected (may cause issues)"

    - name: Build module
      run: python build.py

    - name: Report System Capabilities
      run: python tests/test_capabilities.py
      continue-on-error: true

    - name: Run tests
      run: python run_tests.py --no-color

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-py${{ matrix.python-version }}
        path: |
          *.so
          build/artifacts/

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools pybind11 numpy

    - name: Check AVX2 support
      run: |
        echo "CPU Info:"
        sysctl machdep.cpu.features | grep -o 'AVX2' || echo "AVX2 not detected (may cause issues)"

    - name: Build module
      run: python build.py

    - name: Report System Capabilities
      run: python tests/test_capabilities.py
      continue-on-error: true

    - name: Run tests
      run: python run_tests.py --no-color

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos-py${{ matrix.python-version }}
        path: |
          *.so
          build/artifacts/

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check file structure
      run: |
        echo "Checking project structure..."
        test -f "README.md" || (echo "Missing README.md" && exit 1)
        test -f "build.py" || (echo "Missing build.py" && exit 1)
        test -f "run_tests.py" || (echo "Missing run_tests.py" && exit 1)
        test -d "tests" || (echo "Missing tests directory" && exit 1)
        test -d "benchmarks" || (echo "Missing benchmarks directory" && exit 1)
        echo "[OK] Project structure OK"

    - name: Check for critical files
      run: |
        echo "Checking critical source files..."
        test -f "ternary_simd_engine.cpp" || (echo "Missing ternary_simd_engine.cpp" && exit 1)
        test -f "ternary_algebra.h" || (echo "Missing ternary_algebra.h" && exit 1)
        test -f "ternary_lut_gen.h" || (echo "Missing ternary_lut_gen.h" && exit 1)
        echo "[OK] Critical files present"

    - name: Line count statistics
      run: |
        echo "Code statistics:"
        find . -name "*.cpp" -o -name "*.h" -o -name "*.py" | grep -v build/ | xargs wc -l | tail -1
