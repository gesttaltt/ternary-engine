  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check file structure
      run: |
        echo "Checking project structure..."
        test -f "README.md" || (echo "Missing README.md" && exit 1)
        test -f "build.py" || (echo "Missing build.py" && exit 1)
        test -f "run_tests.py" || (echo "Missing run_tests.py" && exit 1)
        test -d "tests" || (echo "Missing tests directory" && exit 1)
        test -d "benchmarks" || (echo "Missing benchmarks directory" && exit 1)
        echo "[OK] Project structure OK"

    - name: Check for critical files
      run: |
        echo "Checking critical source files..."
        test -f "ternary_simd_engine.cpp" || (echo "Missing ternary_simd_engine.cpp" && exit 1)
        test -f "ternary_algebra.h" || (echo "Missing ternary_algebra.h" && exit 1)
        test -f "ternary_lut_gen.h" || (echo "Missing ternary_lut_gen.h" && exit 1)
        echo "[OK] Critical files present"

    - name: Line count statistics
      run: |
        echo "Code statistics:"
        find . -name "*.cpp" -o -name "*.h" -o -name "*.py" | grep -v build/ | xargs wc -l | tail -1
