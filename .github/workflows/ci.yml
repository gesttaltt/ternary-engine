name: CI

# Linux x64 validation: build the SIMD engine, TritNet GEMM, Dense243,
# zero-skip GEMM, backend, and TritNet inference modules, then run the full
# test suite (15 suites as of 2026-08-14 — expanded from the original
# 7-suite/65-test run_tests.py after triaging the previously-unwired test
# files in tests/python/; see commit history for what was added and why).
# TritNet inference added 2026-08-15 (code review): its own test suite
# (tests/python/test_tritnet_inference_bindings.py) has an import-guard that
# self-skips-as-passed when the module isn't built, so CI was silently
# never running its real assertions.
# Formalizes the local Linux validation of 2026-07-23 (see CLAUDE.md
# "Critical Gaps" #1).
#
# Note: Windows x64 remains the production-validated platform. This workflow
# guards against regressions on Linux; it does not replace the Windows
# benchmark validation required for performance claims.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    name: Build & test (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify AVX2 support on runner
        run: grep -q avx2 /proc/cpuinfo && echo "AVX2 available"

      - name: Install dependencies
        run: |
          pip install pybind11 numpy setuptools
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build ternary_simd_engine
        run: python build/build.py

      - name: Build TritNet GEMM module
        run: python build/build_tritnet_gemm.py

      - name: Build Dense243 module
        run: python build/build_dense243.py

      - name: Build zero-skip GEMM module
        run: python build/build_zero_skip_gemm.py

      - name: Build backend module
        run: python build/build_backend.py

      - name: Build TritNet inference module
        run: python build/build_tritnet_inference.py

      - name: Run test suite
        run: python tests/run_tests.py --no-color
