name: Run PGO Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  pgo-benchmark:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy setuptools wheel

    - name: Build ternary_simd_engine module
      run: python build.py

    - name: Run PGO benchmark (quick mode)
      run: python benchmarks/bench_phase0.py --quick --output=benchmarks/results/pgo

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pgo-benchmark-results
        path: benchmarks/results/pgo/
        retention-days: 30
