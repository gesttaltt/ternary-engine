name: Run PGO Benchmark

on:
  workflow_dispatch:  # Manual trigger only - PGO benchmarks temporarily disabled until fixed
    inputs:
      benchmark_mode:
        description: 'Benchmark mode (quick/full)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full

env:
  # Build configuration
  PYTHON_VERSION: '3.11'
  MSVC_ARCH: 'x64'

  # PGO configuration
  PGO_MODE: 'full'
  BENCHMARK_MODE: ${{ github.event.inputs.benchmark_mode || 'quick' }}

  # Dependency versions (can be overridden via repository secrets)
  PYBIND11_VERSION: 'latest'
  NUMPY_VERSION: 'latest'

  # Artifact configuration
  ARTIFACT_RETENTION_DAYS: '30'

jobs:
  pgo-benchmark:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(vars.PGO_TIMEOUT_MINUTES || '45') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11${{ env.PYBIND11_VERSION != 'latest' && format('=={0}', env.PYBIND11_VERSION) || '' }} numpy${{ env.NUMPY_VERSION != 'latest' && format('=={0}', env.NUMPY_VERSION) || '' }} setuptools wheel
      env:
        PYBIND11_VERSION: ${{ secrets.PYBIND11_VERSION || env.PYBIND11_VERSION }}
        NUMPY_VERSION: ${{ secrets.NUMPY_VERSION || env.NUMPY_VERSION }}

    - name: Build ternary_simd_engine module
      run: python build.py
      env:
        BUILD_VERBOSE: ${{ secrets.BUILD_VERBOSE || '0' }}
      # Note: Requires MSVC 2017+ with C++17 support and AVX2 flags

    - name: Verify module was built
      run: |
        if (Test-Path "ternary_simd_engine*.pyd") {
          Write-Host "[OK] Module built successfully"
          Get-ChildItem ternary_simd_engine*.pyd | ForEach-Object { Write-Host "  Found: $($_.Name) ($([math]::Round($_.Length/1KB, 2)) KB)" }
        } else {
          Write-Host "[ERROR] Module file not found!"
          Write-Host "Checking build artifacts directory..."
          Get-ChildItem -Path build -Recurse -Filter "*.pyd" -ErrorAction SilentlyContinue
          exit 1
        }
      shell: pwsh

    - name: Run PGO benchmark
      run: python benchmarks/bench_phase0.py ${{ env.BENCHMARK_MODE == 'quick' && '--quick' || '' }} --output=benchmarks/results/pgo
      env:
        BENCHMARK_ITERATIONS: ${{ secrets.BENCHMARK_ITERATIONS || '1000' }}
      # Note: Benchmark expects ternary_simd_engine module to be successfully built

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pgo-benchmark-results
        path: benchmarks/results/pgo/
        retention-days: ${{ fromJSON(vars.ARTIFACT_RETENTION_DAYS || env.ARTIFACT_RETENTION_DAYS) }}
