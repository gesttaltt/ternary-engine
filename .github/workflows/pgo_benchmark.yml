name: Run PGO Benchmark

on:
  workflow_dispatch:  # Manual trigger only - PGO benchmarks temporarily disabled until fixed

jobs:
  pgo-benchmark:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy setuptools wheel

    - name: Build ternary_simd_engine module
      run: python build.py
      # Note: Requires MSVC 2017+ with C++17 support and AVX2 flags

    - name: Verify module was built
      run: |
        if (Test-Path "ternary_simd_engine*.pyd") {
          Write-Host "[OK] Module built successfully"
          Get-ChildItem ternary_simd_engine*.pyd | ForEach-Object { Write-Host "  Found: $($_.Name) ($([math]::Round($_.Length/1KB, 2)) KB)" }
        } else {
          Write-Host "[ERROR] Module file not found!"
          Write-Host "Checking build artifacts directory..."
          Get-ChildItem -Path build -Recurse -Filter "*.pyd" -ErrorAction SilentlyContinue
          exit 1
        }
      shell: pwsh

    - name: Run PGO benchmark (quick mode)
      run: python benchmarks/bench_phase0.py --quick --output=benchmarks/results/pgo
      # Note: Benchmark expects ternary_simd_engine module to be successfully built

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pgo-benchmark-results
        path: benchmarks/results/pgo/
        retention-days: 30
