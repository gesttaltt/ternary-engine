name: Run PGO Benchmark

on:
  workflow_dispatch:  # Manual trigger only - PGO benchmarks temporarily disabled until fixed

jobs:
  pgo-benchmark:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy setuptools wheel

    - name: Build ternary_simd_engine module
      run: python build.py
      # Note: Build may fail on CI runners - investigating module build issues

    - name: Run PGO benchmark (quick mode)
      run: python benchmarks/bench_phase0.py --quick --output=benchmarks/results/pgo
      # Note: Benchmark expects ternary_simd_engine module to be successfully built

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pgo-benchmark-results
        path: benchmarks/results/pgo/
        retention-days: 30
